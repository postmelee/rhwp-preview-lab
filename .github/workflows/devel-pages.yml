name: Devel Pages
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild current devel even if unchanged or in retry cooldown
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths: ['devel/**', '.github/workflows/devel-pages.yml']
  push:
    branches: [main]
    paths: ['devel/**', '.github/workflows/devel-pages.yml']
permissions: {}
cache-mode: none
concurrency:
  group: devel-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    outputs:
      build: ${{ steps.gate.outputs.build }}
      sha: ${{ steps.gate.outputs.sha }}
      recipe: ${{ steps.gate.outputs.recipe }}
      deployment: ${{ steps.gate.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: python3 devel/control.py gate
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      recipe: ${{ steps.resolve.outputs.recipe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s devel/tests -v
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 devel/control.py resolve
  build:
    needs: [gate, check]
    if: >-
      always() && !cancelled() &&
      ((needs.gate.result == 'success' && needs.gate.outputs.build == 'true') ||
       (github.event_name == 'pull_request' && needs.check.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha || needs.check.outputs.sha }}
      RECIPE: ${{ needs.gate.outputs.recipe || needs.check.outputs.recipe }}
      RUSTUP_TOOLCHAIN: 1.93.1
      GIT_LFS_SKIP_SMUDGE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/target/devel-pages
      RHWP_WITHOUT_HWPCTRL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: edwardkim/rhwp
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install pinned release tools
        run: |
          rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
      - name: Build exact source without deployment credentials
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          scripts/wasm-pack-locked.sh --target web --out-dir pkg --release
          python3 ../harness/devel/site.py prepare . "$SOURCE_SHA"
          npm --prefix rhwp-studio ci --no-audit
          npm --prefix rhwp-studio run build -- --config vite.devel.config.ts
          python3 ../harness/devel/site.py stamp . "$SOURCE_SHA"
          python3 ../harness/devel/site.py validate rhwp-studio/dist "$SOURCE_SHA" > ../static-validation.json
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: source/rhwp-studio/dist
          retention-days: 1
      - name: Browser smoke at the Pages subpath
        timeout-minutes: 4
        run: node harness/devel/smoke.mjs source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: devel-evidence-${{ github.run_attempt }}
          path: |
            static-validation.json
            smoke-evidence/
          retention-days: 3
          if-no-files-found: ignore
  publish:
    needs: [gate, build]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject obsolete harness reruns
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 devel/control.py guard
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify public metadata after CDN propagation
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RECIPE: ${{ needs.gate.outputs.recipe }}
        run: |
          for _attempt in $(seq 1 12); do
            if python3 devel/control.py verify; then exit 0; fi
            sleep 10
          done
          exit 1
  finish:
    needs: [gate, build, publish]
    if: always() && needs.gate.outputs.deployment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.gate.outputs.deployment }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RECIPE: ${{ needs.gate.outputs.recipe }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: python3 devel/control.py finish
