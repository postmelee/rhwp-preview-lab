name: Lab Preview
on:
  workflow_run:
    workflows: [Lab CI, Lab Quality]
    types: [completed]
  pull_request_target:
    branches: [devel]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to revalidate (0 for current devel)'
        required: true
        default: '0'
      approve_sha:
        description: 'Fork publish approval: exact current 40-character head SHA (one run only)'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: lab-publisher
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install pinned deployment tool without credentials
        run: npm ci --ignore-scripts
      - name: Reconcile from trusted code; never execute artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python3 lab/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification.json
          if-no-files-found: error
          retention-days: 3
