name: Studio Republish Probe
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Previously inspected real-source run ID'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-real-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit
      - name: Recover inspected build artifacts without rebuilding source
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 lab/recover_studio.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-republish-verification
          path: studio-verification.json
          retention-days: 3
